<style>
/* ===== Colours and fonts: change them here ===== */
:root{
  --ink:#111418; --paper:#F5F5F2; --white:#FFFFFF;
  --accent:#C2410C; --accent-light:#F2A07B;
  --text:#3A3F45; --muted:#5B6067; --line:#DAD9D3; --line-dark:#2A2F35;
  --display:'Archivo',sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  --radius:12px; --gutter:clamp(20px,4vw,48px); --section:clamp(44px,5.5vw,76px);
  --shadow:0 1px 2px rgba(17,20,24,.04),0 12px 28px -14px rgba(17,20,24,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-0.02em;line-height:1.1;margin:0;text-wrap:balance}
p,li,figcaption,summary{text-wrap:balance}
.about p,.card details p{text-wrap:pretty}
.nb{white-space:nowrap}
.w{max-width:1240px;margin:0 auto;padding:0 var(--gutter)}
.dark{background:var(--ink);color:var(--paper)}
.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 18px}
.dark .kicker{color:var(--accent-light)}
.sec{padding-top:var(--section)}
.sec h2{font-size:clamp(30px,3.6vw,46px);max-width:780px;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:56px;padding:16px 30px;font-size:17px;border-radius:8px;font-weight:600;text-decoration:none;transition:filter .15s,transform .15s}
.btn-main{background:var(--accent);color:var(--white)}
.btn-line{border:1.5px solid var(--paper);color:var(--paper)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}

/* header */
header{display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1240px;margin:0 auto;padding:22px var(--gutter)}
.logo{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-0.02em;text-decoration:none;white-space:nowrap}
nav{display:flex;gap:36px;align-items:center;font-size:19px;font-weight:500}
nav a{text-decoration:none}
nav a:not(.pill):hover{color:var(--accent-light)}
nav .pill{background:var(--accent);color:var(--white);font-weight:600;padding:15px 28px;border-radius:8px;white-space:nowrap;text-align:center;transition:filter .15s}
nav .pill:hover{filter:brightness(1.08)}
nav .pill.pill-line{background:transparent;border:1.5px solid var(--paper);color:var(--paper);padding:13.5px 26.5px;margin-right:-20px}
nav .pill.pill-line:hover{background:var(--paper);color:var(--ink);filter:none}

/* hero */
.hero{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(32px,4vw,56px);align-items:center;padding-top:clamp(8px,1.5vw,20px);padding-bottom:clamp(40px,5vw,64px)}
.hero h1{font-size:clamp(44px,5.2vw,72px);line-height:1.02;letter-spacing:-0.025em}
.hl .win{display:block;position:relative;overflow:hidden;width:fit-content;height:1.25em;padding-bottom:.16em;color:var(--accent-light)}
.hl .win .wd{position:absolute;left:0;top:0;white-space:pre}
.hl .win .c{display:inline-block;will-change:transform;transform-origin:50% 100%}
@media (min-width:800px){
  .hero h1.hl{white-space:nowrap}
  .hl .win{display:inline-block;vertical-align:top;height:1.02em;padding-bottom:.2em;margin-bottom:-.2em}
}
.hl .win .bar{position:absolute;left:0;bottom:.05em;height:.08em;width:100%;background:var(--accent);transform-origin:left;border-radius:2px}
.hero .sub{font-size:clamp(18px,1.6vw,22px);color:#C9CCD0;max-width:none;margin:28px 0 0;text-wrap:pretty}
.hero .small{font-size:15px;color:#A3A8AE;margin:20px 0 0;max-width:none;text-wrap:pretty}
.hero figure{margin:0}
.hero figure img{border-radius:var(--radius);aspect-ratio:16/9;object-fit:cover;width:100%;border:1px solid rgba(245,245,242,.16);box-shadow:0 24px 60px -24px rgba(0,0,0,.7)}
.hero figcaption{font-size:15px;color:#A3A8AE;margin-top:14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.hero .slides{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(245,245,242,.16);box-shadow:0 24px 60px -24px rgba(0,0,0,.7);background:#1A1E23}
.hero .slides img{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;box-shadow:none;aspect-ratio:auto;opacity:0;transition:opacity .9s ease}
.hero .slides img.on{opacity:1}
.hero .slides .nav{position:absolute;top:0;bottom:0;z-index:2;width:24%;display:flex;align-items:center;padding:0 14px;border:0;color:#fff;cursor:pointer;opacity:0;transition:opacity .2s}
.hero .slides .prev{left:0;justify-content:flex-start;background:linear-gradient(90deg,rgba(13,16,19,.8),rgba(13,16,19,0))}
.hero .slides .next{right:0;justify-content:flex-end;background:linear-gradient(270deg,rgba(13,16,19,.8),rgba(13,16,19,0))}
.hero .slides .nav:hover,.hero .slides .nav:focus-visible{opacity:1}
.hero .slides .nav svg{width:40px;height:40px;padding:8px;border-radius:0;background:rgba(13,16,19,.55);transition:background .15s}
.hero .slides .nav:hover svg{background:var(--accent)}
@media (hover:none){.hero .slides .nav{opacity:1;width:18%}}
.hero .stats-label{grid-column:1/-1;margin:48px 0 0;padding-top:24px;border-top:1px solid var(--line-dark);font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#A3A8AE}
.hero .stats{grid-column:1/-1;list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.hero .stats b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(20px,2.1vw,28px);line-height:1.1;letter-spacing:-0.01em;color:var(--accent-light)}
.hero .stats span{display:block;margin-top:6px;font-size:15px;color:#C9CCD0}
.hero .dots{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-width:0}
.hero > div,.hero figure{min-width:0}
.hero .dots .pause{display:grid;place-items:center;width:32px;height:32px;margin-right:8px;color:#F5F5F2}
.hero .dots .pause::after{display:none}
.hero .dots .pause svg{width:16px;height:16px}
.hero .dots button{position:relative;width:26px;height:32px;padding:0;background:none;border:0;cursor:pointer}
.hero .dots button::after{content:"";position:absolute;left:5px;right:5px;top:14px;height:4px;border-radius:2px;background:rgba(245,245,242,.28);transition:background .2s}
.hero .dots button:hover::after{background:rgba(245,245,242,.6)}
.hero .dots button[aria-current="true"]::after{background:var(--accent-light)}

/* studios strip */
.strip{background:var(--white);border-bottom:1px solid var(--line)}
.strip .w{display:flex;flex-direction:column;gap:18px;padding-top:28px;padding-bottom:28px}
.strip .row{display:grid;grid-template-columns:210px 1fr;gap:8px 24px;align-items:baseline}
.strip .names{display:flex;flex-wrap:wrap;gap:6px 32px}
.strip .names span{white-space:nowrap}
.strip .marquee{display:block;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.strip .track{display:flex;width:max-content;animation:roll 70s linear infinite}
.strip .set{display:flex;flex-shrink:0;gap:32px;padding-right:32px}
.strip .marquee:hover .track{animation-play-state:paused}
@keyframes roll{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){
  .strip .marquee{overflow:visible;-webkit-mask-image:none;mask-image:none}
  .strip .track{animation:none;width:auto}
  .strip .set{flex-wrap:wrap;padding-right:0}
  .strip .set[aria-hidden]{display:none}
}
.strip .note{margin:0;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.strip span{font-family:var(--display);font-weight:700}
.strip .label{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* tabs */
.ask:has(+ .note){margin-bottom:6px}
.ask + .note{margin:0 0 20px}
.ask{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.4vw,30px);letter-spacing:-0.01em;line-height:1.15;margin:0 0 16px}
.tabs{display:inline-flex;gap:4px;padding:5px;border:2px solid var(--ink);border-radius:999px;background:var(--white);margin-bottom:40px}
.tabs button{background:none;border:0;border-radius:999px;padding:0 32px;min-height:60px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
.tabs button:hover{background:var(--paper)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--white)}
.moments{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.moments li{display:flex;flex-direction:column;gap:14px;padding:24px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);font-family:var(--display);font-weight:700;font-size:19px;line-height:1.3}
.moments li .see{margin-top:auto;padding-top:14px;font-family:var(--body);font-weight:600;font-size:15px;color:var(--accent);text-decoration:none}
.moments li .see:hover{text-decoration:underline}
.moments li b{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--accent)}
.explain{max-width:780px;margin:0 0 48px;padding:20px 24px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);font-size:18px;color:var(--text)}
.explain strong{display:block;margin-bottom:4px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink)}
.pull{margin:48px 0 0;padding:clamp(28px,4vw,52px);background:var(--ink);color:var(--paper);border-radius:var(--radius);font-family:var(--display);font-weight:800;font-size:clamp(24px,2.8vw,34px);line-height:1.2;letter-spacing:-0.02em;text-wrap:balance}
.offers-head{margin-top:56px}
.offers-head h2{margin-bottom:14px}
.offers-head .pub-line{margin:-18px 0 32px;color:var(--ink)}
.offers-head p{color:var(--text);margin:0 0 32px;max-width:780px}
.offers{display:flex;flex-direction:column;gap:16px}
.offer{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 260px;gap:16px 40px;align-items:start;padding:28px 32px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.offer .kicker{margin:0 0 6px}
.offers > .note{margin:0}
.offer h3{font-size:24px;line-height:1.2;margin-bottom:6px}
.offer .fmt{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0}
.offer .body{margin:0;color:var(--text);font-size:16px}
.offer > div:last-child{padding-left:32px;border-left:1px solid var(--line);min-width:200px}
.offer .price{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.2;display:block;margin-bottom:8px}
.offer .price + a{font-size:15px;font-weight:600;color:var(--accent)}
.note{font-size:15px;color:var(--muted);margin:24px 0 0;max-width:900px}
.note strong{color:var(--ink)}

/* work */
.work{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.work.featured{grid-template-columns:repeat(2,1fr)}
.work.featured .card h3{font-size:28px}
.work.featured .card .hook{font-size:18px}
.work.featured .card .meta{font-size:13px}
.more-head{font-size:26px;margin:56px 0 24px}
.work[hidden]{display:none}
#more-work{margin-top:24px}
.more-toggle{display:flex;align-items:center;justify-content:center;gap:10px;margin:32px auto 0;min-height:52px;padding:0 28px;background:var(--white);border:1.5px solid var(--ink);border-radius:8px;color:var(--ink);font:600 17px var(--body);cursor:pointer;transition:background .15s,color .15s}
.more-toggle:hover{background:var(--ink);color:var(--paper)}
.more-toggle svg{width:20px;height:20px;transition:transform .2s}
.more-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.card{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:box-shadow .2s,transform .2s}
.work .card{cursor:pointer}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.work .card:hover .more{text-decoration:underline}
.card .pic{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--tint,#2A2F35);display:flex;align-items:flex-end;padding:18px;border-bottom:1px solid var(--line)}
.card .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .pic span{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;color:rgba(245,245,242,.35)}
.card .meta{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:20px 24px 6px}
.card h3{font-size:22px;line-height:1.2;margin:0 24px}
.card .hook{color:var(--text);font-size:16px;margin:8px 24px 0;flex:1}
.card details{margin:14px 24px 24px;font-size:15px;color:var(--text)}
.card summary{cursor:pointer;font-weight:600;color:var(--accent)}
.card details p{margin:10px 0 0}
.card details b{color:var(--ink)}
.card .more{align-self:flex-start;margin:14px 24px 24px;padding:0;background:none;border:0;font:inherit;font-size:15px;font-weight:600;color:var(--accent);cursor:pointer}
.card .more::after{content:" \2192"}
.card .more:hover{text-decoration:underline}
body:has(dialog[open]){overflow:hidden}
dialog.story{width:min(820px,calc(100% - 32px));max-height:calc(100dvh - 48px);padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:auto}
dialog.story::backdrop{background:rgba(17,20,24,.65)}
.story .card{border:0;border-radius:0;box-shadow:none;transform:none}
.story .card{display:grid;grid-template-columns:1fr;align-items:start;padding:28px}
.story .card .pic{grid-column:1;grid-row:auto;max-width:none;margin-bottom:20px;padding:0;border:1px solid var(--line);border-radius:8px}
.story .card .meta,.story .card h3,.story .card .hook{grid-column:1;margin-right:40px}
.story .card .meta{margin-top:0;margin-left:0}
.story .card h3{margin-left:0;font-size:26px}
.story .card .hook{flex:none;font-size:17px;margin-left:0;margin-top:8px}
.story .story-cta{position:sticky;bottom:0;z-index:1;padding:14px 28px calc(14px + env(safe-area-inset-bottom));background:var(--white);border-top:1px solid var(--line)}
.story .full{grid-column:1/-1;margin:24px 0 0;max-width:68ch;display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.6;color:var(--text)}
.story .full p{margin:0}
.story .story-cta a{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:8px;background:var(--accent);color:var(--white);font-weight:600;text-decoration:none;transition:filter .15s,transform .15s}
.story .story-cta a::after{content:"\2197"}
.story .story-cta a:hover{filter:brightness(1.08);transform:translateY(-1px)}
.story .full b{color:var(--ink)}
.story .close,.mail .close{position:absolute;top:14px;right:14px;z-index:2;width:40px;height:40px;border-radius:0;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.story .close:hover,.mail .close:hover{background:var(--ink);color:var(--paper)}
@media (max-width:560px){
  .story .card{grid-template-columns:1fr;padding:20px}
  .story .card .pic{grid-column:1;grid-row:auto;max-width:none;margin-bottom:16px}
  .story .card .meta,.story .card h3,.story .card .hook{grid-column:1}
  .story .story-cta{padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
  .story .story-cta a{width:100%;justify-content:center}
}

/* proof, steps, fit */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;list-style:none;margin:0;padding:0}
.item{padding:28px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.item h3{font-size:21px;font-weight:700;margin-bottom:8px;letter-spacing:-0.01em}
.item p{margin:0;color:var(--text);font-size:16px}
.item .n{font-family:var(--display);font-weight:800;font-size:34px;color:var(--accent);margin:0 0 10px}
.fit h2{font-size:26px;margin-bottom:16px}
.fit .grid2 > div{padding:32px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.fit ul{margin:0;padding-left:20px;color:var(--text);display:flex;flex-direction:column;gap:10px}
.fit li::marker{color:var(--accent)}

/* about */
.fit{padding-bottom:var(--section)}
.about{display:grid;grid-template-columns:200px 1fr;gap:clamp(32px,5vw,64px);align-items:start;padding:clamp(28px,4vw,56px);background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.about img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.about h2{margin-bottom:20px}
.about p{color:var(--text);max-width:720px;margin:0 0 16px}
.about blockquote{margin:24px 0 0;max-width:720px;padding-top:24px;border-top:2px solid var(--ink);font-family:var(--display);font-weight:500;font-size:21px;line-height:1.45}

/* contact */
.contact{padding-top:var(--section);padding-bottom:var(--section)}
.contact h2{font-size:clamp(32px,4.5vw,54px);line-height:1.05;max-width:900px}
.contact .links{margin:28px 0 0}
footer{border-top:1px solid var(--line-dark)}
footer .w{padding-top:24px;padding-bottom:24px;font-size:13px;color:#A3A8AE}

/* desktop hero: headline runs the full width, text and image sit side by side below it */
@media (min-width:861px){
  .hero{row-gap:0}
  .hero > div{display:contents}
  .hero .kicker,.hero h1{grid-column:1/-1}
  .hero .sub,.hero .ctas{grid-column:1}
  .hero .small{grid-column:1/-1;order:10;margin-top:32px}
  .hero figure{grid-column:2;grid-row:3/5;align-self:center}
  .hero h1{margin-bottom:8px}
}

dialog.mail{width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:32px 28px 28px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog.mail::backdrop{background:rgba(17,20,24,.65)}
.mail h3{font-size:26px;margin:0 40px 8px 0}
.mail .mail-addr{margin:0 0 20px;font-size:18px;color:var(--text);word-break:break-all;user-select:all}
.mail .mail-intro{margin:0 0 18px;font-size:16px;color:var(--text)}
.mail .mail-form{display:flex;flex-direction:column;gap:6px;margin:0 0 22px}
.mail .mail-form label{margin-top:8px;font-weight:600;font-size:15px}
.mail .mail-form input,.mail .mail-form select,.mail .mail-form textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);font:inherit;font-size:16px}
.mail .mail-form textarea{resize:vertical;min-height:84px}
.mail .linklike{align-self:center;margin-top:4px;padding:6px;background:none;border:0;font:inherit;font-size:15px;color:var(--text);text-decoration:underline;cursor:pointer}
.mail .mail-actions{display:flex;flex-direction:column;gap:10px}
.mail .mail-actions .alt{background:var(--white);border:1.5px solid var(--ink);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.mail .mail-actions .alt:hover{background:var(--ink);color:var(--paper);filter:none}
.cta-band{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;margin-top:40px;padding:28px 32px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.cta-actions{display:flex;flex-wrap:wrap;gap:12px}
.btn-alt{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn-alt:hover{background:var(--ink);color:var(--paper);filter:none}
.cta-band p{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(20px,2.2vw,26px);line-height:1.2;max-width:34ch;text-wrap:balance}
footer a{color:inherit}
footer .fine{margin:10px 0 0;font-size:12px;color:#8A9096}

.lead{max-width:780px;margin:-8px 0 36px;font-size:18px;color:var(--text)}
.sub-head{font-size:clamp(22px,2.4vw,28px);margin:56px 0 20px}
.faq{display:flex;flex-direction:column;gap:12px;max-width:860px}
.faq-item{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.faq-item summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;cursor:pointer;list-style:none;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.3}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:"+";flex-shrink:0;font-size:26px;line-height:1;color:var(--accent);transition:transform .2s}
.faq-item[open] summary::after{transform:rotate(45deg)}
.faq-item p{margin:0;padding:0 24px 22px;max-width:70ch;color:var(--text)}

.subtabs{display:flex;gap:10px;margin:0 0 36px}
.subtabs button{min-width:200px;min-height:56px;padding:0 28px;border:1.5px solid var(--ink);border-radius:8px;background:var(--white);color:var(--ink);font-family:var(--display);font-weight:800;font-size:20px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.subtabs button:hover{background:var(--paper)}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.rail{list-style:none;margin:0 0 8px;padding:0 0 0 36px;position:relative;max-width:820px}
.rail:before{content:"";position:absolute;left:11px;top:12px;bottom:28px;width:2px;background:var(--line)}
.st{position:relative;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin:0 0 12px}
.st:before{content:"";box-sizing:border-box;position:absolute;left:-32px;top:19px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--accent)}
.st.opt:before{background:var(--paper);border:2px dashed var(--accent)}
.st b{display:block;margin:0 0 4px;font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.st span{color:var(--text)}
.st .sum{display:none}
.about-more{display:none}
.swipe-dots{display:none}
.rail-note{margin:6px 0 28px;color:var(--muted);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{padding:18px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.tile svg{display:block;width:26px;height:26px;margin:0 0 10px;color:var(--accent)}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.2}
.tile span{display:block;margin-top:4px;font-size:15px;color:var(--muted)}
.tile.wide{grid-column:1/-1}
.menu-btn{display:none;width:44px;height:44px;place-items:center;background:none;border:1.5px solid var(--paper);border-radius:8px;color:var(--paper);cursor:pointer}
.menu-btn svg{width:24px;height:24px}
.mobile-menu{background:var(--ink);padding:0 var(--gutter) 10px}
.mobile-menu[hidden]{display:none}
.mobile-menu a{display:block;padding:15px 0;border-top:1px solid var(--line-dark);font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;color:var(--paper)}
.dock{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:10px;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:var(--paper);border-top:1px solid var(--line);visibility:hidden;transform:translateY(100%);transition:transform .2s,visibility 0s .2s}
.dock.show{visibility:visible;transform:none;transition:transform .2s}
.dock .btn{flex:1;min-height:48px;padding:12px 10px}

/* tablets */

  .logo{white-space:nowrap}
  .subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:0;margin:0 0 24px;overflow:visible}
  .subtabs button{min-width:0;margin:0;min-height:52px;padding:10px 6px;border:1.5px solid var(--ink);border-radius:8px;background:var(--white);color:var(--ink);font-size:17px;line-height:1.1;white-space:normal}

  .offer h3{font-size:19px;margin-bottom:2px}
  .offer .price{grid-area:price;margin:0;font-size:18px;text-align:right;white-space:nowrap}
  .offer .price::after{content:"";display:inline-block;width:8px;height:8px;margin-left:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
  .offer.open .price::after{transform:rotate(-135deg) translateY(-2px)}
  .offer .body{grid-area:body;display:none;margin:12px 0 0}

  .swipe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gutter);margin-inline:calc(var(--gutter) * -1);padding:2px var(--gutter) 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

  .fit .grid2 > div h2::after{content:"+";position:absolute;right:20px;top:14px;font-family:var(--body);font-size:26px;font-weight:400;line-height:1;color:var(--accent)}
  .fit .grid2 > div.open h2::after{content:"\2013"}
  .fit .grid2 > div ul{display:none;padding:0 20px 20px 40px}

/* ===== Report skin: milestone-report look layered over the base styles. Delete this block to go back. ===== */
:root{
  --accent:#B23A0A; --accent-light:#F2A07B; --line:#DDDCD7; --line-dark:#2A2F35;
  --display:'IBM Plex Sans',system-ui,sans-serif; --radius:0px; --shadow:none;
  --desk:#D9D8D3; --gutter:clamp(20px,5vw,64px);
  --g-bg:#DDF1E3; --g-fg:#14532D; --a-bg:#FDEBC8; --a-fg:#7A4A04; --b-bg:#DCE7FB; --b-fg:#1E3A8A;
}
body{background-color:#F6F5EF;background-image:linear-gradient(#E3E1D6 1px,transparent 1px),linear-gradient(90deg,#E3E1D6 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed}
.paper{max-width:1180px;margin:28px auto 64px;background:var(--white);box-shadow:0 0 0 1px #D2CFC3, 0 2px 0 #C4C3BE;counter-reset:sec}
.paper .w,.paper header{max-width:none}
h1,h2,h3{font-weight:700;letter-spacing:-0.015em}
.kicker,.dark .kicker{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--accent)}
.dark .kicker{color:var(--accent-light)}
.btn{border-radius:0}
.btn-line:hover{background:var(--paper);color:var(--ink);filter:none}
.btn-alt:hover{color:var(--white)}

/* status badges */
.rag{display:inline-block;margin-left:12px;padding:3px 8px;border-radius:0;font:600 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;vertical-align:1px;white-space:nowrap}
.rag.g{background:var(--g-bg);color:var(--g-fg)}
p.kicker:has(.rag){display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
p.kicker .rag{margin-left:0;padding:4px 10px;vertical-align:baseline}

/* numbered report section headings */
.hero .stats-label,section.sec > .kicker:first-child,.about .kicker,#offers > .ask,#contact .kicker{
  display:flex;gap:12px;align-items:baseline;margin:0 0 20px;padding:0 0 8px;border:0;border-bottom:1px solid var(--ink);
  font-family:var(--body);font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1.3}
.hero .stats-label::before,section.sec > .kicker:first-child::before,.about .kicker::before,#offers > .ask::before,#contact .kicker::before{
  counter-increment:sec;content:counter(sec,decimal-leading-zero);font-family:var(--mono);font-weight:600;color:var(--accent)}

/* header */
.logo{font-size:24px}
nav{font-size:16px}
nav a:not(.pill):hover{color:var(--accent-light)}
nav .pill{border-radius:0;padding:12px 18px}
nav .pill.pill-line{padding:10.5px 16.5px}
.menu-btn{border-radius:0}

/* hero */
.hero figure img,.hero .slides{border-radius:0}
.hero figcaption{font-family:var(--mono);font-size:12px}
.hero figcaption strong{color:var(--paper)}
.hero .stats{gap:1px;margin-top:0;background:#3A4048;border:1px solid #3A4048}
.hero .stats li{background:var(--ink);padding:14px 16px}
.hero .stats b{color:var(--paper);font-family:var(--body);font-weight:700}
.hero .stats span{color:#C9CCD0}
.dark .hero .stats-label,#contact .kicker{color:var(--paper);border-bottom-color:#3A4048}
.dark .hero .stats-label::before,#contact .kicker::before{color:var(--accent-light)}
.hero .stats li::after{content:attr(data-status);display:inline-block;margin-top:10px;padding:3px 8px;border-radius:0;background:var(--g-bg);color:var(--g-fg);font:600 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* strip */
.strip{border-top:1px solid var(--line)}
.hero .stats-label{margin-top:48px}
.offers > .note{max-width:none}
@media (max-width:860px){.hero .stats-label{margin-top:32px}}

/* work: report rows with thumbnails */
.card,.card:hover{border-radius:0;box-shadow:none;transform:none}
.card .pic{border-color:var(--ink)}
.card .meta{color:var(--muted)}
.card .more{font-family:var(--mono);font-size:13px}
@media (min-width:861px){
  .work,.work.featured{display:block;border-top:2px solid var(--ink)}
  .work .card{display:grid;grid-template-columns:180px minmax(0,1fr) auto;grid-template-areas:"pic meta more" "pic title more" "pic hook more";grid-template-rows:auto auto 1fr;column-gap:24px;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:none}
  .work .card:hover{background:#FAFAF7}
  .work .card .pic{grid-area:pic;padding:0;border:1px solid var(--ink);aspect-ratio:16/9}
  .work .card .pic span{font-size:15px;padding:8px}
  .work .card .meta{grid-area:meta;margin:0 0 4px;font-size:11px}
  .work .card h3,.work.featured .card h3{grid-area:title;margin:0;font-size:18px}
  .work .card .hook,.work.featured .card .hook{grid-area:hook;margin:4px 0 0;font-size:15px}
  .work .card .more{grid-area:more;margin:0;align-self:center}
  .work .card details{grid-area:more;margin:0}
  #more-work{margin-top:0;border-top:0}
}
.work .card .pic{border-radius:0}
.more-toggle{border-radius:0}
dialog.story,dialog.mail{border-radius:0;border-color:var(--ink)}
.story .card .pic{border-radius:0;border-color:var(--ink)}
.story .story-cta a{border-radius:0}
.cta-band{border-radius:0;border:1px solid var(--ink)}

/* proof, about */
.item{border-radius:0;border-color:var(--ink)}
.item h3{font-size:18px}
.about{border-radius:0;border-color:var(--ink)}
.about img{border-radius:0;border-color:var(--ink)}
.about blockquote{border-top:0;border-left:4px solid var(--ink);padding:10px 0 10px 18px;font-family:var(--body);font-weight:600;font-size:20px}

/* offers */
.tabs{border-radius:0;border:1px solid var(--ink);padding:0;gap:0}
.tabs button{border-radius:0;font-family:var(--body);font-weight:700;font-size:17px;min-height:48px}
.tabs button[aria-selected="true"]{background:var(--ink)}
.subtabs button{border-radius:0;font-family:var(--body);font-weight:600;font-size:16px;min-height:48px}
.subtabs button:hover{background:#F2F1EC}
.moments li{border-radius:0}
.explain{border-radius:0;border-color:var(--ink)}
.explain strong{font-family:var(--body);font-weight:700}
.pull{background:none;color:var(--ink);border-left:4px solid var(--ink);border-radius:0;padding:12px 0 12px 20px;font-family:var(--body);font-weight:700;font-size:clamp(20px,2.2vw,24px)}
.offer{border-radius:0}
.offer .kicker{display:inline-block;padding:3px 8px;border-radius:0;background:var(--a-bg);color:var(--a-fg);font-size:11px;letter-spacing:.06em}
.offer .price{font-family:var(--body);font-weight:700}
@media (min-width:861px){
  .moments{display:block;border-top:2px solid var(--ink)}
  .moments li{flex-direction:row;align-items:baseline;gap:16px;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;font-family:var(--body);font-weight:600;font-size:17px}
  .moments li .see{margin:0 0 0 auto;padding:0;white-space:nowrap;font-family:var(--mono);font-size:13px}
  .offers{gap:0;border-top:2px solid var(--ink)}
  .offer{border:0;border-bottom:1px solid var(--line);padding:22px 0;background:none}
  .offers > .note{padding:12px 0;border-bottom:1px solid var(--line)}
}
.st{border-radius:0;border-color:var(--ink)}
.st:before{border-radius:0}
.st > b::after{content:"Ready";margin-left:10px;padding:2px 7px;border-radius:0;background:var(--g-bg);color:var(--g-fg);font-size:10px;letter-spacing:.06em;vertical-align:1px}
.st.opt > b::after{content:"Optional";background:var(--b-bg);color:var(--b-fg)}
.tile{border-radius:0}
.tile b{font-family:var(--body);font-weight:700}
.faq-item{border-radius:0}
.faq-item summary{font-family:var(--body);font-weight:600}
.fit .grid2 > div{border-radius:0;border-color:var(--ink)}
.fit h2{font-size:18px}

/* contact: decision box */
#contact{padding-top:var(--section)}
#contact .contact{margin:0 var(--gutter);padding:28px;border:2px solid var(--paper)}
#contact .contact h2{font-size:clamp(24px,3vw,32px);line-height:1.2}
#contact .owner{margin:18px 0 0;font-family:var(--mono);font-size:13px;color:#A3A8AE}
footer{border-top:0;margin-top:40px}

/* phone dock */
.dock{background:var(--white);border-top:1px solid var(--ink)}
.mail .mail-form input,.mail .mail-form select,.mail .mail-form textarea{border-radius:0}

@media (max-width:860px){
  body{background:var(--ink)}
  .paper{margin:0;box-shadow:none}
  .hero .stats{grid-template-columns:1fr 1fr}
  .work .card{border-radius:0;border-color:var(--line)}
  .work .card .pic{border:1px solid var(--ink)}
  #contact .contact{margin-left:var(--gutter);margin-right:var(--gutter);padding:20px}
}

/* ===== Offers clarity: groups, column heads, a clear first step, real buttons ===== */
.offer-cols{display:none}
.offers .group{margin:0;padding:8px 12px;background:#F4F2EC;border-bottom:1px solid var(--line);font:600 12px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.offer .fmt{font-family:var(--body);font-size:14px;color:#4A4F55;margin-top:2px}
.offer .body{font-size:16px;line-height:1.6;color:var(--text)}
.offer .price{font-size:24px;color:var(--ink)}
.offer .price + a{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;padding:10px 16px;border:1.5px solid var(--ink);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;transition:background .15s,color .15s}
.offer .price + a:hover{background:var(--ink);color:var(--white)}
.offer:has(.kicker){background:#FFF8EF;box-shadow:inset 4px 0 0 var(--accent)}
